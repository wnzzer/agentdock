name: Release

# A tag publishes. workflow_dispatch builds the same artifacts and publishes
# nothing, so a target can be proven on every platform before a version exists.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is absent on purpose: it fails on libc::SIGKILL, which that
        # platform has no equivalent for, and nothing here — the PTY, the
        # process groups, the client config paths — has ever been run there.
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zig: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            zig: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: pnpm/action-setup@v4
        with:
          version: '10.30.3'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The binary embeds apps/web/dist. Building it first is what makes the
      # released executable a complete one rather than a server with no pages.
      - run: pnpm build:web

      # musl links SQLite's bundled C, so these targets need a C cross compiler.
      # zig is one, for every target, without a per-arch toolchain to install.
      - uses: mlugg/setup-zig@v2
        if: matrix.zig
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        if: matrix.zig
        with:
          tool: cargo-zigbuild

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --release --locked -p agentdock-server --target ${{ matrix.target }}
          else
            cargo build --release --locked -p agentdock-server --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          name="agentdock-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/agentdock-server" "dist/${name}/"
          cp README.md "dist/${name}/"
          cd dist
          tar czf "${name}.tar.gz" "${name}"
          rm -rf "${name}"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # One list of hashes for the whole release, so a download can be checked
      # without trusting the page it came from.
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
