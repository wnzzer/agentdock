name: Release

# A tag publishes. workflow_dispatch builds the same artifacts and publishes
# nothing, so a target can be proven on every platform before a version exists.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is absent on purpose: it fails on libc::SIGKILL, which that
        # platform has no equivalent for, and nothing here — the PTY, the
        # process groups, the client config paths — has ever been run there.
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zig: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            zig: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: pnpm/action-setup@v4
        with:
          version: '10.30.3'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The binary embeds apps/web/dist. Building it first is what makes the
      # released executable a complete one rather than a server with no pages.
      - run: pnpm build:web

      # musl links SQLite's bundled C, so these targets need a C cross compiler.
      # zig is one, for every target, without a per-arch toolchain to install.
      - uses: mlugg/setup-zig@v2
        if: matrix.zig
        with:
          version: 0.14.1
      - uses: taiki-e/install-action@v2
        if: matrix.zig
        with:
          tool: cargo-zigbuild

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --release --locked -p agentdock-server --target ${{ matrix.target }}
          else
            cargo build --release --locked -p agentdock-server --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          name="agentdock-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/agentdock-server" "dist/${name}/"
          cp README.md "dist/${name}/"
          cd dist
          tar czf "${name}.tar.gz" "${name}"
          rm -rf "${name}"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  npm:
    name: npm
    needs: build
    # Runs on workflow_dispatch too, publishing nothing. Putting a package on
    # the registry cannot be undone — unpublishing is allowed only briefly and
    # burns the version number for good — so the job that does it should have
    # been run before the run that matters.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          # Writes the .npmrc that reads NODE_AUTH_TOKEN, so the token never
          # has to be echoed into a file of our own.
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # The packages carry a version that must be the one being tagged. Deriving
      # it from the manifest and checking the tag agrees stops a tag typo from
      # publishing a version nobody asked for.
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$tag" ]; then
              echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
              exit 1
            fi
            echo "dry_run=" >> "$GITHUB_OUTPUT"
          else
            echo "not a tag: building the packages and publishing nothing"
            echo "dry_run=--dry-run" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: node npm/build-packages.mjs "${{ steps.version.outputs.version }}" artifacts

      # Ordered by the build script: every platform package before the one that
      # depends on them, so an install can never resolve to a shim with no
      # binary behind it. Already-published versions are skipped rather than
      # failing, which is what makes a half-finished publish re-runnable.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ steps.version.outputs.dry_run }}
        run: |
          set -euo pipefail
          # Read the list up front rather than piping it into the loop: npm
          # inherits stdin, and a command that reads any of it swallows the
          # packages still to come, publishing a partial release quietly. The
          # names are a fixed [a-z0-9-] set, so word splitting is exact here,
          # and unlike mapfile this runs on the bash 3.2 a macOS check would use.
          packages=$(cat dist-npm/publish-order.txt)
          for pkg in $packages; do
            name="@wnzzer/${pkg}"
            if npm view "${name}@${VERSION}" version >/dev/null 2>&1 </dev/null; then
              echo "= ${name}@${VERSION} already published"
              continue
            fi
            echo "+ publishing ${name}@${VERSION}"
            npm publish "dist-npm/${pkg}" --access public $DRY_RUN </dev/null
          done
          echo "processed $(echo "$packages" | wc -l | tr -d " ") packages at ${VERSION} ${DRY_RUN}"

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # One list of hashes for the whole release, so a download can be checked
      # without trusting the page it came from.
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
