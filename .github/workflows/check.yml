name: Check
on: [push, pull_request]
jobs:
  test:
    strategy:
      # Each platform compiles code the others never see (cfg(unix),
      # cfg(windows)), so one failing must not hide what the others report.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
        with:
          version: '10.30.3'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The server embeds apps/web/dist, and rust-embed against a folder that
      # does not exist compiles to a struct with no iter/get rather than to an
      # error naming the folder. So the web build comes before anything cargo,
      # and what the Rust tests link is the real bundle.
      - run: pnpm build:web
      - run: pnpm typecheck:bridge
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: pnpm test
